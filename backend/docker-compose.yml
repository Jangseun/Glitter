# 개발용 PostgreSQL을 Docker로 띄우는 설정이에요. (FastAPI 서버는 Docker 없이 그냥 실행)
#
# 사용법 (backend 폴더에서):
#   docker compose up -d     ← DB 켜기 (백그라운드)
#   docker compose down      ← DB 끄기 (데이터는 volume에 남아있음)
#   docker compose down -v   ← DB 끄고 데이터까지 전부 삭제
#
# ${POSTGRES_USER} 같은 값은 같은 폴더의 .env 파일에서 자동으로 읽어와요.

# 프로젝트 이름. 안 적으면 폴더 이름("backend")이 붙어서 Docker Desktop에 "backend"로 보여요.
name: glitter

services:
  db:
    image: postgres:17
    # 컨테이너 이름을 직접 지정. (안 하면 "glitter-db-1"처럼 번호가 붙어요)
    # 터미널에서 DB에 접속할 때: docker exec -it glitter-db psql -U glitter -d glitter
    container_name: glitter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # "내 PC 포트:컨테이너 포트". 내 PC의 5432로 접속하면 컨테이너 안 DB로 연결돼요.
      # 127.0.0.1을 앞에 붙여서 "내 PC에서만" 접속할 수 있게 해요. (안 붙이면 같은 와이파이의 다른 기기에서도 접속 가능)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너를 지웠다 다시 만들어도 데이터가 남도록 별도 저장공간(volume)에 저장
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
    # volume 이름도 직접 지정 (안 하면 "glitter_db-data"처럼 프로젝트 이름이 앞에 붙어요)
    name: glitter-db-data
