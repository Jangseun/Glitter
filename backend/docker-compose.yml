# 개발용 PostgreSQL을 Docker로 띄우는 설정이에요. (FastAPI 서버는 Docker 없이 그냥 실행)
#
# 사용법 (backend 폴더에서):
#   docker compose up -d     ← DB 켜기 (백그라운드)
#   docker compose down      ← DB 끄기 (데이터는 volume에 남아있음)
#   docker compose down -v   ← DB 끄고 데이터까지 전부 삭제
#
# ${POSTGRES_USER} 같은 값은 같은 폴더의 .env 파일에서 자동으로 읽어와요.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # "내 PC 포트:컨테이너 포트". 내 PC의 5432로 접속하면 컨테이너 안 DB로 연결돼요.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 컨테이너를 지웠다 다시 만들어도 데이터가 남도록 별도 저장공간(volume)에 저장
      - glitter-db:/var/lib/postgresql/data

volumes:
  glitter-db:
